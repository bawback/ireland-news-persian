name: Morning digest

on:
  # Runs automatically inside the hourly news pipeline (started by pg_cron), because GitHub's
  # own schedule was hours late. This workflow is for running it by hand.
  workflow_dispatch:
    inputs:
      force:
        description: "Post now, whatever the time"
        type: boolean
        default: false
      dry_run:
        description: "Only show the message in the log, do not post"
        type: boolean
        default: false

concurrency:
  group: morning-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/post-digest.ts
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
