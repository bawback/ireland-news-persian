name: Check sources

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 1" # every Monday morning

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-sources.ts
