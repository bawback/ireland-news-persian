name: Rewrite one day's articles

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to rewrite, YYYY-MM-DD (empty = yesterday, Dublin time)"
        default: ""
      apply:
        description: "Save the rewritten articles (otherwise only report)"
        type: boolean
        default: false
      match:
        description: "Only articles whose Persian title contains this text (empty = all that day)"
        default: ""
      edit_telegram:
        description: "Also edit the already-sent Telegram post"
        type: boolean
        default: false
      voice:
        description: "Writing voice (babak or default)"
        default: "babak"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/rewrite.ts
        env:
          REWRITE_DATE: ${{ inputs.date }}
          APPLY: ${{ inputs.apply }}
          REWRITE_MATCH: ${{ inputs.match }}
          EDIT_TELEGRAM: ${{ inputs.edit_telegram }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          WRITER_VOICE: ${{ inputs.voice }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL || 'claude-haiku-5-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewrite-backup
          path: rewrite-backup.json
          retention-days: 90
