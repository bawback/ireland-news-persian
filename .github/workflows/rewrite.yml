name: Rewrite one day's articles

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Day to rewrite, YYYY-MM-DD (empty = yesterday, Dublin time)"
        default: ""
      apply:
        description: "Save the rewritten articles (otherwise only report)"
        type: boolean
        default: false
      voice:
        description: "Writing voice (babak or default)"
        default: "babak"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/rewrite.ts
        env:
          REWRITE_DATE: ${{ inputs.date }}
          APPLY: ${{ inputs.apply }}
          WRITER_VOICE: ${{ inputs.voice }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL || 'claude-haiku-5-5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
