name: Find repeated news

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "3"
      apply:
        description: "Unpublish the repeats (can be undone in admin)"
        type: boolean
        default: false
      backfill:
        description: "Count how often each recent story was reported («خبر داغ»)"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/dedup-audit.ts
        env:
          DEDUP_DAYS: ${{ inputs.days }}
          DEDUP_APPLY: ${{ inputs.apply }}
          DEDUP_BACKFILL: ${{ inputs.backfill }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.backfill != true }}
        with:
          name: dedup-report
          path: dedup-report.md
