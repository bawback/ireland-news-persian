name: News pipeline

on:
  # Started every hour (06:27-23:27 UTC) by a pg_cron job in Supabase, because GitHub's own
  # schedule turned out to be unreliable. Can also be run by hand from the Actions tab.
  workflow_dispatch: {}

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect, classify and write news
        run: npx tsx scripts/ingest.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          REQUIRE_REVIEW: ${{ vars.REQUIRE_REVIEW || 'false' }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '3' }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE || '3' }}
          MAX_FUN_PER_RUN: ${{ vars.MAX_FUN_PER_RUN || '1' }}
          WRITER_MODEL: ${{ vars.WRITER_MODEL || 'claude-haiku-5-5' }}
          WRITER_MODEL_IMPORTANT: ${{ vars.WRITER_MODEL_IMPORTANT || 'claude-haiku-5-5' }}
          WRITER_VOICE: ${{ vars.WRITER_VOICE || 'babak' }}
      - name: Add AI pictures to new articles
        run: npx tsx scripts/add-images.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          IMAGES_PER_RUN: ${{ vars.IMAGES_PER_RUN || '8' }}
      - name: Post to Telegram
        run: npx tsx scripts/post-telegram.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
