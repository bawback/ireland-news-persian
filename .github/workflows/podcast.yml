name: Nightly podcast

on:
  # Started at 21:00 and 22:00 UTC by Supabase pg_cron; the script only runs at 22:xx Dublin time.
  workflow_dispatch:
    inputs:
      force:
        description: "Make an episode now, whatever the time (replaces today's)"
        type: boolean
        default: false
      telegram:
        description: "Also post it to the Telegram channel"
        type: boolean
        default: true

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Make and publish the podcast
        run: npx tsx scripts/podcast.ts
        env:
          FORCE: ${{ inputs.force }}
          PODCAST_TELEGRAM: ${{ github.event.inputs.telegram || 'true' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_VOICE: ${{ vars.AZURE_VOICE || 'fa-IR-FaridNeural' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          PODCAST_NAME: ${{ vars.PODCAST_NAME || 'شب بخیر ایرلند' }}
