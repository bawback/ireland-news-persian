name: Screenshots

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji >/dev/null
          node scripts/tools/screenshots.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Upload to storage (public links)
        run: |
          for f in shots/*.png; do
            n=$(basename $f)
            curl -sS -X POST "$SUPABASE_URL/storage/v1/object/news-images/screenshots/$n" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "x-upsert: true" -H "Content-Type: image/png" \
              --data-binary @"$f" -o /dev/null -w "%{http_code} $n\n"
          done
          echo "LINK_BASE ${SUPABASE_URL#https://}/storage/v1/object/public/news-images/screenshots/"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Push the pictures to the "screenshots" branch
        run: |
          mkdir /tmp/s && cp shots/*.png /tmp/s/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screenshots
          git rm -rfq . && rm -rf shots node_modules package*.json
          cp /tmp/s/*.png . && git add *.png
          git commit -qm "Screenshots $(date -u +%F)"
          git push -f origin screenshots
